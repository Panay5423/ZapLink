<div class="notif-wrapper">
  @for (notif of notificationService.notifications(); track notif.id) {
    <div [@toastAnimation] class="notif-card">
      <!-- Glowing edge accent -->
      <div class="edge-accent"></div>

      <!-- Icon / Avatar -->
      <div class="notif-icon-container">
        <svg class="notif-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
      </div>

      <!-- Content -->
      <div class="notif-content">
        <h4 class="notif-title">
          New Notification
          <span class="pulse-indicator">
            <span class="ping"></span>
            <span class="dot"></span>
          </span>
        </h4>
        <p class="notif-message">
          {{ notif.message }}
        </p>
        @if (notif.from) {
          <p class="notif-uid">UID: {{ notif.from.substring(0, 10) }}...</p>
        }
      </div>

      <!-- Close Button -->
      <button class="close-btn" (click)="notificationService.remove(notif.id)">
        <svg class="notif-close-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  }
</div>
