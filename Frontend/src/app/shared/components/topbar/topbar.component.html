<div class="topbar">
    <div class="search">
        <i class='bx bx-search search-icon'></i>
        <input type="text" placeholder="Search users, posts..." class="search-input" [formControl]="query"
            (focus)="query.value ? isSearchDropdownOpen = true : null" (blur)="closeDropdown()">

        <!-- Dropdown Menu -->
        <div class="search-dropdown" *ngIf="isSearchDropdownOpen">
            <!-- Loading State -->
            <div class="search-state" *ngIf="isLoading">
                <i class='bx bx-loader-alt bx-spin'></i> Searching...
            </div>

            <!-- Results -->
            <div class="search-results" *ngIf="!isLoading && searchResults.length > 0">
                <div class="search-item" *ngFor="let user of searchResults" (mousedown)="selectUser(user)">
                    <img [src]="getProfileUrl(user)" alt="avatar" class="search-avatar">
                    <div class="search-info">
                        <span class="search-username">{{user.username || user.name || 'Unknown User'}}</span>
                        <span class="search-subtext" *ngIf="user.email || user.username">{{user.email || '@' +
                            user.username}}</span>
                    </div>
                </div>
            </div>

            <!-- Empty State -->
            <div class="search-state" *ngIf="!isLoading && searchResults.length === 0 && query.value">
                No results found for "{{query.value}}"
            </div>
        </div>
    </div>

    <div class="topbar-actions">
        <!-- Dark Mode Toggle Button -->
        <button class="icon-btn theme-toggle" (click)="toggleTheme()" title="Toggle Dark Mode">
            <i class='bx' [ngClass]="isDark ? 'bx-sun' : 'bx-moon'"></i>
        </button>

        <div class="notification-container" style="position: relative;">
            <button class="icon-btn notification" (click)="toggleNotificationDropdown()">
                <i class='bx bx-bell'></i>
                <span class="dot" *ngIf="notificationService.history().length > 0"></span>
            </button>

            <!-- Notifications Dropdown -->
            <div class="notification-dropdown" *ngIf="isNotificationDropdownOpen">
                <div class="notif-header">
                    <h3>Notifications</h3>
                    <button class="clear-notifs" (click)="notificationService.clearHistory()" *ngIf="notificationService.history().length > 0">Clear All</button>
                </div>
                
                <div class="notif-list">
                    <div class="notif-empty" *ngIf="notificationService.history().length === 0">
                        <i class='bx bx-bell-off'></i>
                        <p>No notifications yet</p>
                    </div>

                    <div class="notif-item" *ngFor="let notif of notificationService.history()">
                        <div class="notif-icon-small">
                            <i class='bx bx-info-circle'></i>
                        </div>
                        <div class="notif-info">
                            <p class="notif-text">{{ notif.message }}</p>
                            <span class="notif-meta">
                                <span class="notif-time">{{ notif.timestamp | date:'shortTime' }}</span>
                                <span class="notif-uid" *ngIf="notif.from">&bull; UID: {{ notif.from | slice:0:10 }}</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button class="icon-btn add-post">
            <i class='bx bx-plus'></i>
        </button>
    </div>
</div>
